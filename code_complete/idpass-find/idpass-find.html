<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="idpass-find-section">
            <h1>아이디/패스워드 찾기</h1>
            <div class="idpass-find-container">
                <h2>아이디 찾기</h2>
                <form>
                    <label for="username">이름</label>
                    <input type="text" id="find-username" name="find-username" required>
                    <label for="phone">전화번호</label>
                    <div class="find-phone">
                        <input type="text" id="find-phone1" name="find-phone1" maxlength="3" required>
                        <input type="text" id="find-phone2" name="find-phone2" maxlength="4" required>
                        <input type="text" id="find-phone3" name="find-phone3" maxlength="4" required>
                    </div>
                    <button type="button" id="find-id-button">회원아이디 찾기</button>
                </form>
            </div>
            <div class="idpass-find-container">
                <h2>아이디 찾기</h2>
                <form>
                    <label for="userid">아이디</label>
                    <input type="text" id="find-userid" name="find-userid" required>
                    <label for="userid">이름</label>
                    <input type="text" id="find-username" name="find-username" required>
                    <button type="button" id="find-pass-button">새 비밀번호 받기</button>
                </form>
            </div>
        </div>  
    </main>
</body>
</html>
